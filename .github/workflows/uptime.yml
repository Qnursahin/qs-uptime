name: uptime
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          fail=""
          for u in "https://www.qslater.com/" "https://www.qslater.com/api/health" "https://www.qslater.com/api/health?deep=1"; do
            code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$u" || echo 000)
            [ "$code" = "200" ] || fail="$fail\n$u -> $code"
          done
          if [ -n "$fail" ]; then
            curl -s -m 15 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=$(printf '🔴 QS LATER ERİŞİLEMİYOR%b' "$fail")" >/dev/null
            exit 1
          fi
